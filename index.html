<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Sprout Farm</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div id="unity-container">
      <canvas
        id="unity-canvas"
        width="1280"
        height="720"
        tabindex="-1"
      ></canvas>
      <div id="unity-loading-bar" class="waiting">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <button id="start-button" type="button" autofocus>START</button>
        <p id="start-hint">클릭하면 게임을 불러와요 · 소리가 함께 재생돼요</p>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var startButton = document.querySelector("#start-button");
      var startHint = document.querySelector("#start-hint");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/SproutFarm.loader.js";
      var config = {
        dataUrl: buildUrl + "/SproutFarm.data.unityweb",
        frameworkUrl: buildUrl + "/SproutFarm.framework.js.unityweb",
        codeUrl: buildUrl + "/SproutFarm.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Sprout Farm",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // The day/night overlay in GameScene (UI > DayNightCycle > DayNightLight)
      // is a fixed 2778x1284px rect, so keep the render target inside that size
      // (with a pixel of headroom for rounding) or the overlay stops short of the
      // top/right edges on large or HiDPI screens.
      var maxRenderWidth = 2776;
      var maxRenderHeight = 1282;
      function renderPixelRatio() {
        return Math.min(
          window.devicePixelRatio || 1,
          maxRenderWidth / canvas.clientWidth,
          maxRenderHeight / canvas.clientHeight
        );
      }

      // Browsers keep audio suspended until the user interacts with the page.
      // Create the AudioContext inside the START click and hand it to Unity,
      // so the game's sound plays as soon as it loads (Safari included).
      function unlockAudio() {
        var NativeAudioContext = window.AudioContext || window.webkitAudioContext;
        if (!NativeAudioContext) return;
        var unlocked = new NativeAudioContext();
        unlocked.resume();
        window.AudioContext = function (options) {
          if (!unlocked) return new NativeAudioContext(options);
          var audioContext = unlocked;
          unlocked = null;
          return audioContext;
        };
        window.AudioContext.prototype = NativeAudioContext.prototype;
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
      }

      // The loading screen shows START in place of the progress bar until clicked.
      loadingBar.style.display = "block";

      function startGame() {
        unlockAudio();
        startButton.remove();
        startHint.remove();
        loadingBar.classList.remove("waiting");
        config.devicePixelRatio = renderPixelRatio();

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              // config is copied into Module at startup, so later updates go there.
              unityInstance.Module.devicePixelRatio = renderPixelRatio();
              window.addEventListener("resize", () => {
                unityInstance.Module.devicePixelRatio = renderPixelRatio();
              });
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      }

      startButton.addEventListener("click", startGame, { once: true });
    </script>
  </body>
</html>
