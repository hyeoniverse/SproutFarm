<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <!-- Fill the screen on phones and tablets (including iPads that report a desktop user agent);
         no zooming, so double taps on the on-screen buttons don't zoom the page -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Sprout Farm</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css?v=6" />
    <script src="TemplateData/ranking.js?v=5" defer></script>
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Vercel Web Analytics / Speed Insights. The queue shims collect anything
         fired before the scripts load; both scripts are served by Vercel itself
         and simply 404 when the page runs anywhere else. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>
  <body>
    <div id="unity-container">
      <canvas
        id="unity-canvas"
        width="1280"
        height="720"
        tabindex="-1"
      ></canvas>
      <div id="unity-loading-bar" class="waiting">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
        <div id="start-character" aria-hidden="true"></div>
        <button id="start-button" type="button" aria-label="START" autofocus></button>
        <p id="start-hint">누르면 게임을 불러와 · 소리도 같이 나와!</p>
      </div>
      <div id="unity-warning"></div>
      <!-- Shown by style.css on touch screens held upright: the game is drawn for landscape -->
      <div id="rotate-hint" role="alert">
        <div id="rotate-phone" aria-hidden="true"></div>
        <p>휴대폰을 가로로 돌려 줘!</p>
      </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");
      var startButton = document.querySelector("#start-button");
      var startHint = document.querySelector("#start-hint");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length
            ? "block"
            : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning")
            div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/SproutFarm.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/SproutFarm.data.unityweb",
        frameworkUrl: buildUrl + "/SproutFarm.framework.js.unityweb",
        codeUrl: buildUrl + "/SproutFarm.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Sprout Farm",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // Phones and tablets: the game shows its own joystick and buttons (MobileInput.cs asks the
      // same media query through SproutFarm.jslib).
      var isTouchDevice = window.matchMedia("(pointer: coarse)").matches;

      // On touch screens, START also goes full screen and holds landscape where the browser allows it
      // (Android Chrome). iPhone Safari supports neither, so the rotate hint covers that case.
      function enterLandscape() {
        var page = document.documentElement;
        if (!isTouchDevice || !page.requestFullscreen) return;
        page
          .requestFullscreen()
          .then(function () {
            return screen.orientation && screen.orientation.lock
              ? screen.orientation.lock("landscape")
              : null;
          })
          .catch(function () {});
      }

      // The loading screen shows START in place of the progress bar until clicked.
      // Loading only after that click means the page already has a user gesture
      // when Unity creates its AudioContext, so the game's sound can play.
      loadingBar.style.display = "block";

      function startGame() {
        enterLandscape();
        startButton.remove();
        startHint.remove();
        loadingBar.classList.remove("waiting");

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
            })
            .catch((message) => {
              alert(message);
            });
        };
        document.body.appendChild(script);
      }

      startButton.addEventListener("click", startGame, { once: true });
    </script>
  </body>
</html>
